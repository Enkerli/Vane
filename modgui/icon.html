<!-- Vane minimal modgui.  Based on MOD's canonical icon template
     (mod-audio/mod-lv2-data Shiroverb.lv2), trimmed to four controls.
     {{#controls}} iterates the modgui:port list in manifest.ttl; each control
     binds to its LV2 port by symbol via mod-role="input-control-port".
     Toggles (monoMode, unisonMode) render as 2-position knobs — functional. -->
<div class="mod-pedal mod-pedal-vane{{{cns}}} mod-{{color}}">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="mod-plugin-brand"><h1>{{brand}}</h1></div>
    <div class="mod-plugin-name"><h1>{{label}}</h1></div>
    <div class="mod-light on" mod-role="bypass-light"></div>

    <div class="mod-control-group clearfix">
        {{#controls}}
        <div class="mod-knob">
            <div class="mod-knob-image" mod-role="input-control-port"
                 mod-port-symbol="{{symbol}}" title="{{name}}"></div>
            <span class="mod-knob-title">{{name}}</span>
        </div>
        {{/controls}}
    </div>

    <div class="mod-footswitch" mod-role="bypass" title="On / Off"></div>

    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}"
             mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div></div>
        {{/effect.ports.audio.input}}
        {{#effect.ports.midi.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}"
             mod-role="input-midi-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div></div>
        {{/effect.ports.midi.input}}
    </div>

    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}"
             mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div></div>
        {{/effect.ports.audio.output}}
    </div>
</div>
